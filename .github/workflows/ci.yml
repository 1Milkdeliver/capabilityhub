name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests benchmarks
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=capabilityhub --cov-report=term-missing
      - name: Deterministic benchmark gate
        run: capabilityhub benchmark
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke-test clean base wheel
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .wheel-smoke/bin/capabilityhub health --project-root .
          .wheel-smoke/bin/capabilityhub budget-report
          .wheel-smoke/bin/capabilityhub benchmark
