name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_rag_scale:
        description: Run the real one-million-chunk RAG replay
        required: false
        default: false
        type: boolean
      run_live_model_eval:
        description: Run the optional 30-trial OpenAI model evaluation
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  linux-production-sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Verify Landlock and libseccomp provider confinement
        run: python -m pytest -vv tests/test_linux_sandbox.py tests/test_confinement.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]' playwright
      - name: Run isolated system-Chrome Dashboard gate
        env:
          CAPABILITYHUB_BROWSER_REQUIRED: "1"
          CAPABILITYHUB_CHROME_PATH: /usr/bin/google-chrome
          CAPABILITYHUB_BROWSER_ARTIFACTS: .artifacts/browser
        run: python -m pytest -q tests/browser/test_dashboard_browser.py
      - uses: actions/upload-artifact@v6
        with:
          name: dashboard-browser-${{ github.run_id }}
          path: .artifacts/browser/*.png
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests benchmarks
      - name: Verify release-claim traceability
        run: python scripts/docs_traceability.py
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=capabilityhub --cov-report=term-missing
      - name: Verify POSIX sandbox boundary
        run: python -m pytest -q tests/test_supervision.py tests/test_confinement.py
      - name: Deterministic benchmark gate
        run: |
          capabilityhub benchmark
          capabilityhub benchmark --scale
      - name: Replay validation artifacts
        run: |
          python -c "from benchmarks.harness import assert_validation_artifacts; assert_validation_artifacts()"
          python -c "from benchmarks.rag_scale import validate_release_artifact; validate_release_artifact('benchmarks/artifacts/rag-scale-1m.json')"
          python -c "from benchmarks.release_gate import run_release_gate; run_release_gate()"
          python -c "from capabilityhub.production_profile import load_production_profile, profile_digest; profile_digest(load_production_profile('examples/production-reference.json'))"
          python -c "from benchmarks.adversarial_gate import run_adversarial_gate; run_adversarial_gate()"
          python -m benchmarks.model_eval --artifact model-eval-offline.json
          python -c "from benchmarks.model_eval import validate_artifact; validate_artifact('model-eval-offline.json')"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke-test clean base wheel
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .wheel-smoke/bin/capabilityhub health --project-root .
          .wheel-smoke/bin/capabilityhub budget-report
          .wheel-smoke/bin/capabilityhub benchmark
          .wheel-smoke/bin/capabilityhub benchmark --scale
          .wheel-smoke/bin/capabilityhub import-openapi --help
          .wheel-smoke/bin/python -m benchmarks.wheel_smoke

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Static checks
        run: |
          python -m ruff check src tests benchmarks
          python -m mypy
      - name: Test and benchmark
        run: |
          python -m pytest
          python -m pytest -q tests/test_supervision.py tests/test_confinement.py
          capabilityhub benchmark
          capabilityhub benchmark --scale
          python -c "from benchmarks.harness import assert_validation_artifacts; assert_validation_artifacts()"
          python -c "from benchmarks.rag_scale import validate_release_artifact; validate_release_artifact('benchmarks/artifacts/rag-scale-1m.json')"
          python -c "from benchmarks.release_gate import run_release_gate; run_release_gate()"
          python -c "from capabilityhub.production_profile import load_production_profile, profile_digest; profile_digest(load_production_profile('examples/production-reference.json'))"
          python -c "from benchmarks.adversarial_gate import run_adversarial_gate; run_adversarial_gate()"
      - name: Build and smoke-test wheel
        shell: pwsh
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv .wheel-smoke
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          .\.wheel-smoke\Scripts\python.exe -m pip install --disable-pip-version-check $wheel
          .\.wheel-smoke\Scripts\capabilityhub.exe health --project-root .
          .\.wheel-smoke\Scripts\capabilityhub.exe benchmark
          .\.wheel-smoke\Scripts\capabilityhub.exe benchmark --scale
          .\.wheel-smoke\Scripts\capabilityhub.exe import-openapi --help
          .\.wheel-smoke\Scripts\python.exe -m benchmarks.wheel_smoke

  full-rag-scale:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_full_rag_scale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Replay one-million-chunk RAG evidence
        run: |
          python -m benchmarks.rag_scale --chunks 1000000 --seed 20260812 --concurrency 32 --artifact rag-scale-1m-replay.json
          python -c "from benchmarks.rag_scale import validate_release_artifact; validate_release_artifact('rag-scale-1m-replay.json')"
      - uses: actions/upload-artifact@v6
        with:
          name: rag-scale-1m-${{ github.run_id }}
          path: rag-scale-1m-replay.json
          if-no-files-found: error

  live-model-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_model_eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with official OpenAI SDK
        run: python -m pip install --disable-pip-version-check -e '.[dev]' 'openai>=1,<3'
      - name: Run live model evaluation or record an explicit skip
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m benchmarks.model_eval --live --trials 30 --artifact model-eval-live.json
      - name: Validate artifact schema
        run: python -c "from benchmarks.model_eval import validate_artifact; validate_artifact('model-eval-live.json', require_complete=False)"
      - uses: actions/upload-artifact@v6
        with:
          name: model-eval-live-${{ github.run_id }}
          path: model-eval-live.json
          if-no-files-found: error
