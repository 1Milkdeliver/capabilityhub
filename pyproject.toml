[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "capabilityhub"
version = "0.1.0"
description = "A lazy capability control plane for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "1Milkdeliver" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
supply-chain = ["cryptography>=43,<47"]
secret-store = ["keyring>=25,<27"]
dev = [
  "cryptography>=43,<47",
  "mcp>=2,<3",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.8",
  "types-jsonschema>=4.23",
]

[project.urls]
Repository = "https://github.com/1Milkdeliver/capabilityhub"
Issues = "https://github.com/1Milkdeliver/capabilityhub/issues"

[project.scripts]
capabilityhub = "capabilityhub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capabilityhub", "benchmarks"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["capabilityhub"]
