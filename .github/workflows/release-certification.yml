name: Release Certification

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-subject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Build source and wheel once, then measure subject and SBOM
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          git archive --format=tar --output=capsift-source.tar "$GITHUB_SHA"
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m capabilityhub.release_certification subject --source capsift-source.tar --wheel dist/*.whl --source-revision "$GITHUB_SHA" --sbom release-sbom.json --output release-subject.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-subject-${{ github.run_id }}
          path: |
            capsift-source.tar
            dist/*.whl
            release-sbom.json
            release-subject.json
          if-no-files-found: error

  linux-evidence:
    needs: build-subject
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - uses: actions/download-artifact@v7
        with:
          name: release-subject-${{ github.run_id }}
          path: release-build
      - name: Program-measured tests, static gates, matrix, wheel, search and adversarial evidence
        run: |
          python -m capabilityhub.release_certification gate --type full_pytest --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --output evidence/evidence-full_pytest.json
          python -m capabilityhub.release_certification gate --type ruff --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --output evidence/evidence-ruff.json
          python -m capabilityhub.release_certification gate --type mypy --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --output evidence/evidence-mypy.json
          python -m capabilityhub.release_certification gate --type docs_traceability --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --output evidence/evidence-docs_traceability.json
          python -m capabilityhub.release_certification gate --type matrix_36 --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --output evidence/evidence-matrix_36.json
          python -m capabilityhub.release_certification gate --type wheel --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --artifact release-build/dist/*.whl --output evidence/evidence-wheel.json
          python -m capabilityhub.release_certification gate --type search_10k --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --output evidence/evidence-search_10k.json
          python -m capabilityhub.release_certification gate --type adversarial --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --output evidence/evidence-adversarial.json
          python -m capabilityhub.release_certification gate --type supply_bundle --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --output evidence/evidence-supply_bundle.json
      - name: Mandatory Linux confinement with zero skips
        env:
          CAPABILITYHUB_REQUIRE_LINUX_SANDBOX: "1"
        # The trusted gate runs tests/test_linux_sandbox.py plus supervision/confinement.
        run: python -m capabilityhub.release_certification gate --type sandbox_linux --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --output evidence/evidence-sandbox_linux.json
      - name: Production one-million-chunk measured evidence
        run: |
          python -m benchmarks.rag_scale --chunks 1000000 --seed 20260812 --concurrency 32 --artifact rag-scale-1m-release.json
          python -m capabilityhub.release_certification gate --type rag_1m --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --artifact rag-scale-1m-release.json --output evidence/evidence-rag_1m.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux-${{ github.run_id }}
          path: |
            evidence/evidence-*.json
            rag-scale-1m-release.json
          if-no-files-found: error

  windows-evidence:
    needs: build-subject
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - uses: actions/download-artifact@v7
        with:
          name: release-subject-${{ github.run_id }}
          path: release-build
      - shell: pwsh
        run: python -m capabilityhub.release_certification gate --type sandbox_windows --source-revision $env:GITHUB_SHA --subject release-build/release-subject.json --output evidence/evidence-sandbox_windows.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows-${{ github.run_id }}
          path: evidence/evidence-sandbox_windows.json
          if-no-files-found: error

  browser-evidence:
    needs: build-subject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e '.[dev]' playwright
      - uses: actions/download-artifact@v7
        with:
          name: release-subject-${{ github.run_id }}
          path: release-build
      - name: Real browser gate measured by certification program
        env:
          CAPABILITYHUB_BROWSER_REQUIRED: "1"
          CAPABILITYHUB_CHROME_PATH: /usr/bin/google-chrome
          CAPABILITYHUB_BROWSER_ARTIFACTS: browser
        run: python -m capabilityhub.release_certification gate --type browser --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --output evidence/evidence-browser.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-browser-${{ github.run_id }}
          path: |
            evidence/evidence-browser.json
            browser/*.png
          if-no-files-found: error

  live-model-evidence:
    needs: build-subject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e '.[dev]' 'openai>=1,<3'
      - uses: actions/download-artifact@v7
        with:
          name: release-subject-${{ github.run_id }}
          path: release-build
      - name: Run fresh same-subject live model gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAPABILITYHUB_LIVE_MODEL_EVIDENCE_B64: ${{ secrets.CAPABILITYHUB_LIVE_MODEL_EVIDENCE_B64 }}
        run: |
          if [ -n "$CAPABILITYHUB_LIVE_MODEL_EVIDENCE_B64" ]; then
            printf '%s' "$CAPABILITYHUB_LIVE_MODEL_EVIDENCE_B64" | base64 --decode > model-eval-live.json
          else
            test -n "$OPENAI_API_KEY"
            python -m benchmarks.model_eval --live --trials 30 --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --artifact model-eval-live.json
          fi
          python -m capabilityhub.release_certification gate --type model_live --source-revision "$GITHUB_SHA" --subject release-build/release-subject.json --artifact model-eval-live.json --output evidence/evidence-model_live.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-model-live-${{ github.run_id }}
          path: |
            evidence/evidence-model_live.json
            model-eval-live.json
          if-no-files-found: error

  certify:
    needs: [build-subject, linux-evidence, windows-evidence, browser-evidence, live-model-evidence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e .
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*-${{ github.run_id }}
          path: downloaded-evidence
      - name: Aggregate and sign only complete fresh measured evidence
        env:
          CAPABILITYHUB_RELEASE_SIGNING_KEY: ${{ secrets.CAPABILITYHUB_RELEASE_SIGNING_KEY }}
        run: python -m capabilityhub.release_certification certify --evidence-root downloaded-evidence --source-revision "$GITHUB_SHA" --subject downloaded-evidence/release-subject-${{ github.run_id }}/release-subject.json --subject-artifact-root downloaded-evidence/release-subject-${{ github.run_id }} --key-id github-release-certifier --max-age-hours 12 --manifest release-manifest.json --signature release-manifest.sig.json
      - name: Collect the exact certified release assets
        run: |
          cp downloaded-evidence/release-subject-${{ github.run_id }}/release-subject.json .
          cp downloaded-evidence/release-subject-${{ github.run_id }}/release-sbom.json .
          cp downloaded-evidence/release-subject-${{ github.run_id }}/capsift-source.tar .
          cp downloaded-evidence/release-subject-${{ github.run_id }}/dist/*.whl .
      - uses: actions/upload-artifact@v6
        with:
          name: certified-release-${{ github.run_id }}
          path: |
            release-manifest.json
            release-manifest.sig.json
            release-subject.json
            release-sbom.json
            capsift-source.tar
            capsift-*.whl
          if-no-files-found: error

  publish-release:
    needs: certify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: certified-release-${{ github.run_id }}
          path: certified-release
      - name: Verify tag, version, revision, and immutable artifact set
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tomllib

          root = pathlib.Path("certified-release")
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          revision = os.environ["GITHUB_SHA"]
          if tag != f"v{version}":
              raise SystemExit("release tag does not match project version")
          subject = json.loads((root / "release-subject.json").read_text())
          if subject.get("source_revision") != revision:
              raise SystemExit("release subject does not match tagged revision")
          wheels = tuple(root.glob("capsift-*.whl"))
          if len(wheels) != 1 or f"capsift-{version}-" not in wheels[0].name:
              raise SystemExit("certified release must contain exactly one matching wheel")
          required = (
              "release-manifest.json",
              "release-manifest.sig.json",
              "release-subject.json",
              "release-sbom.json",
              "capsift-source.tar",
          )
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"certified release asset missing: {name}")
          print(hashlib.sha256(wheels[0].read_bytes()).hexdigest())
          PY
      - name: Publish the already-certified immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            certified-release/capsift-*.whl \
            certified-release/capsift-source.tar \
            certified-release/release-subject.json \
            certified-release/release-sbom.json \
            certified-release/release-manifest.json \
            certified-release/release-manifest.sig.json \
            --verify-tag \
            --title "CapSift $GITHUB_REF_NAME" \
            --generate-notes
