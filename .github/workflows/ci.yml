name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy src/capabilityhub
      - name: Test
        run: python -m pytest --cov=capabilityhub --cov-report=term-missing

